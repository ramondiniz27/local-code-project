name: 'Release Multi-Platform'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon (M1/M2/M3/M4)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel Mac
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04' # Linux (AppImage & deb)
            args: ''
          - platform: 'windows-latest' # Windows (MSI & EXE)
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build & Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'local-code v__VERSION__'
          releaseBody: |
            ## 🚀 local-code v__VERSION__
            
            Binários e instaladores nativos oficiais para **macOS**, **Windows** e **Linux**.
            
            ### 📦 Instaladores Disponíveis:
            - **macOS**:
              - `local-code___VERSION___aarch64.dmg` (Apple Silicon M1/M2/M3/M4)
              - `local-code___VERSION___x64.dmg` (Intel Mac)
            - **Windows**:
              - `local-code___VERSION___x64-setup.exe` (Instalador NSIS)
              - `local-code___VERSION___x64_en-US.msi` (Instalador MSI)
            - **Linux**:
              - `local-code___VERSION___amd64.AppImage` (Executável universal Linux)
              - `local-code___VERSION___amd64.deb` (Debian/Ubuntu)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
